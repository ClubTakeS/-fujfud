<style>
/* Layout: a quiet academic index. Masthead with the author, one prominent search field, a catalogue of papers as ruled entries with metadata in a narrow left column. */
:root{
  --paper:#f6f7f8;      /* page */
  --sheet:#ffffff;      /* cards */
  --ink:#1b2230;        /* text */
  --sub:#5b6474;        /* secondary */
  --rule:#d9dde3;       /* hairlines */
  --accent:#1f5f5b;     /* deep teal: links, focus */
  --serif:"Noto Serif JP","Source Serif 4","Hiragino Mincho ProN",serif;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --latin:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14171c;--sheet:#1b1f26;--ink:#e6e8ec;--sub:#9aa3b2;--rule:#2c323c;--accent:#6fb6ae;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#14171c;--sheet:#1b1f26;--ink:#e6e8ec;--sub:#9aa3b2;--rule:#2c323c;--accent:#6fb6ae;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.85}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header.mast{border-bottom:1px solid var(--rule);background:var(--sheet)}
.mast .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:34px;padding-bottom:22px}
.mast h1{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(24px,5vw,32px);letter-spacing:.06em}
.mast h1 small{display:block;font-family:var(--latin);font-weight:400;font-style:italic;font-size:14px;letter-spacing:.04em;color:var(--sub)}
.mast .by{font-size:13px;color:var(--sub);text-align:right}
.mast .by b{display:block;font-family:var(--serif);font-weight:500;font-size:16px;color:var(--ink);letter-spacing:.12em}
main.wrap{padding:28px 20px 64px;display:flex;flex-direction:column;gap:28px}
.search{display:flex;gap:8px}
.search input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:4px}
.search button{font:inherit;padding:0 18px;white-space:nowrap;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:4px;cursor:pointer}
.meta-line{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--sheet);color:var(--sub);border-radius:99px;padding:3px 12px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
ol.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ol.list li{display:grid;grid-template-columns:130px 1fr;gap:6px 22px;padding:22px 0;border-bottom:1px solid var(--rule)}
.side{font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.side .pid{font-family:var(--latin);font-size:13px;color:var(--ink)}
.entry h2{margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.6;text-wrap:balance}
.entry .au{font-size:13px;color:var(--sub);margin:0 0 8px}
.entry .ab{margin:0 0 10px;font-size:14px}
.kw{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.kw span{font-size:12px;color:var(--sub);background:var(--paper);border:1px solid var(--rule);padding:1px 8px;border-radius:3px}
.acts{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px}
.empty{padding:28px 0;color:var(--sub);text-align:center;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
section.about{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
section.about h3{margin:0;font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:.1em}
section.about p{margin:0;font-size:14px;color:var(--sub);max-width:40em}
[hidden]{display:none !important}
.view{display:none;flex-direction:column;gap:28px}.view.on{display:flex}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.06em}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12.5px;color:var(--sub)}
.f input,.f textarea,.f select{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px;width:100%}
.f textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.row2{grid-template-columns:1fr}}
.btn{font:inherit;font-size:14px;padding:9px 18px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:4px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:#a3412f;background:transparent;color:#a3412f}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--sub);margin:0;min-height:1.4em}
.status.err{color:#a3412f}
.note{font-size:12.5px;color:var(--sub);margin:0}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--rule)}
.mrow b{font-weight:500}
.mrow small{display:block;color:var(--sub);font-size:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
footer a{color:var(--sub)}
footer{border-top:1px solid var(--rule);padding:22px 0 34px;font-size:12px;color:var(--sub)}
@media (max-width:600px){ol.list li{grid-template-columns:1fr}.side{flex-direction:row;gap:12px;flex-wrap:wrap}.mast .by{text-align:left}}
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <h1>論文アーカイブ<small>Research Archive</small></h1>
  <p class="by">著者<b>相良 壮琉</b>Takeru Sagara</p>
</div></header>

<main class="wrap">
 <div class="view on" id="v-list">
  <form class="search" id="sf" role="search" autocomplete="off">
    <label for="q" class="sr" style="position:absolute;left:-9999px">論文を検索</label>
    <input id="q" type="search" placeholder="タイトル・キーワード・要旨で検索" enterkeyhint="search">
    <button type="submit">検索</button>
  </form>
  <div class="meta-line"><span id="count">読み込み中…</span><div class="chips" id="cats"></div></div>
  <ol class="list" id="list"></ol>
 </div>

 <div class="view" id="v-manage">
  <div class="panel" id="conn">
    <h3>管理者ログイン</h3>
    <p class="note">論文の投稿・編集は、GitHubのトークンで行います。トークンはこの画面の中だけで使い、どこにも保存しません（「この端末で記憶」を選んだ場合を除く）。</p>
    <div class="f"><label for="gh-repo">リポジトリ（ユーザー名/リポジトリ名）</label><input id="gh-repo" placeholder="例：yourname/archive" autocapitalize="off" autocomplete="off"></div>
    <div class="f"><label for="gh-token">トークン</label><input id="gh-token" type="password" autocomplete="off"></div>
    <label class="chk"><input type="checkbox" id="gh-remember"> この端末でトークンを記憶する</label>
    <button class="btn" type="button" id="gh-go">接続する</button>
    <p class="status" id="gh-msg" role="status"></p>
  </div>
  <div class="panel" id="post" hidden>
    <h3 id="post-h">論文を投稿する</h3>
    <div class="f"><label for="p-title">タイトル</label><input id="p-title" maxlength="160"></div>
    <div class="row2"><div class="f"><label for="p-authors">著者</label><input id="p-authors" value="相良壮琉" maxlength="80"></div><div class="f"><label for="p-date">公開日</label><input id="p-date" type="date"></div></div>
    <div class="row2"><div class="f"><label for="p-cat">分野</label><input id="p-cat" list="catlist" maxlength="30" placeholder="例：看護理論"><datalist id="catlist"></datalist></div><div class="f"><label for="p-kw">キーワード（、区切り）</label><input id="p-kw" maxlength="120"></div></div>
    <div class="f"><label for="p-ab">要旨</label><textarea id="p-ab" maxlength="2000"></textarea></div>
    <div class="f"><label for="p-pdf">PDFファイル</label><input id="p-pdf" type="file" accept="application/pdf,.pdf"></div>
    <p class="note" id="p-pdfnote">編集のときは、PDFを選ばなければ今のファイルのままです。</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="button" id="p-go">投稿する</button><button class="btn ghost" type="button" id="p-cancel" hidden>編集をやめる</button></div>
    <p class="status" id="p-msg" role="status"></p>
  </div>
  <div class="panel" id="mlist" hidden>
    <h3>掲載中の論文</h3>
    <div id="mrows"></div>
    <p class="note">投稿・編集・削除は、GitHubに保存されたあと1〜2分でサイトに反映されます。</p>
  </div>
  <p><a href="#">一覧に戻る</a>　<button class="btn ghost" type="button" id="gh-out" hidden>ログアウト</button></p>
 </div>
</main>

<footer><div class="wrap">掲載論文の無断転載を禁じます。　<a href="#manage">管理者</a></div></footer>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let papers=[],cat="";

  /* ---------- catalogue (papers.json next to this file) ---------- */
  function render(){
    const q=$("q").value.trim().toLowerCase();
    const hit=papers.filter(p=>(!cat||p.category===cat)&&(!q||[p.title,p.abstract,p.id,(p.keywords||[]).join(" "),p.category].join(" ").toLowerCase().includes(q)));
    $("count").textContent=papers.length?`${hit.length} 件${q||cat?`（全 ${papers.length} 件）`:""}`:"0 件";
    $("list").innerHTML=hit.map(p=>`<li id="p-${esc(p.id)}">
      <div class="side"><span class="pid">${esc(p.id)}</span><span>${esc(p.date||"")}</span><span>${esc(p.category||"")}</span></div>
      <div class="entry"><h2>${esc(p.title)}</h2><p class="au">${esc(p.authors||"相良壮琉")}</p>${p.abstract?`<p class="ab">${esc(p.abstract)}</p>`:""}${(p.keywords||[]).length?`<div class="kw">${p.keywords.map(k=>`<span>${esc(k)}</span>`).join("")}</div>`:""}<div class="acts">${p.pdf?`<a href="${esc(p.pdf)}" target="_blank" rel="noopener">PDFを開く</a>`:""}</div></div></li>`).join("")||`<li class="empty" style="display:block">${papers.length?"該当する論文はありません。":"公開している論文はまだありません。"}</li>`;
  }
  function loadList(list){
    papers=(Array.isArray(list)?list:[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id)));
    const cats=[...new Set(papers.map(p=>p.category).filter(Boolean))];
    $("cats").innerHTML=cats.map(c=>`<button type="button" class="chip" aria-pressed="false" data-c="${esc(c)}">${esc(c)}</button>`).join("");
    $("cats").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{cat=cat===b.dataset.c?"":b.dataset.c;$("cats").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.c===cat)));render()}));
    render();
  }
  let initial=[];try{initial=JSON.parse($("papers").textContent)}catch(e){}
  loadList(initial);
  $("q").addEventListener("input",render);

  /* ---------- views ---------- */
  function route(){const m=location.hash==="#manage";$("v-list").classList.toggle("on",!m);$("v-manage").classList.toggle("on",m);if(m)window.scrollTo(0,0)}
  addEventListener("hashchange",route);route();

  /* ---------- posting: write straight to the GitHub repository (Cloudflare redeploys on each commit) ---------- */
  const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
  const API=()=>LS.get("ra-api")||"https://api.github.com";
  let GH=null,editing=null;
  const todayStr=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"});
  const u8b64=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
  async function gh(path,opt={}){
    const r=await fetch(API()+"/repos/"+GH.repo+path,{...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+GH.token,...(opt.body?{"Content-Type":"application/json"}:{})}});
    if(r.status===404&&opt.allow404)return null;
    if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}throw new Error(r.status+" "+m)}
    return r.status===204?{}:r.json();
  }
  const getFile=p=>gh("/contents/"+p.split("/").map(encodeURIComponent).join("/"),{allow404:true});
  const putFile=(p,b64,sha,msg)=>gh("/contents/"+p.split("/").map(encodeURIComponent).join("/"),{method:"PUT",body:JSON.stringify({message:msg,content:b64,...(sha?{sha}:{})})});
  const delFile=(p,sha,msg)=>gh("/contents/"+p.split("/").map(encodeURIComponent).join("/"),{method:"DELETE",body:JSON.stringify({message:msg,sha})});
  const reP=/(<script type="application\/json" id="papers">)[\s\S]*?(<\/script>)/;
  async function saveList(next,msg){
    const f=await getFile("index.html");if(!f)throw new Error("index.html が見つかりません");
    const src=new TextDecoder().decode(Uint8Array.from(atob(f.content.replace(/\n/g,"")),c=>c.charCodeAt(0)));
    if(!reP.test(src))throw new Error("論文一覧の場所が見つかりません");
    const json=JSON.stringify(next).replace(/</g,"\\u003c");
    const out=src.replace(reP,(m,a,b)=>a+json+b);
    await putFile("index.html",u8b64(new TextEncoder().encode(out)),f.sha,msg);
    loadList(next);renderManage();
  }
  const say=(id,t,err)=>{const e=$(id);e.textContent=t;e.className="status"+(err?" err":"")};
  function renderManage(){
    $("catlist").innerHTML=[...new Set(papers.map(p=>p.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
    $("mrows").innerHTML=papers.map(p=>`<div class="mrow"><div><b>${esc(p.title)}</b><small>${esc(p.id)}・${esc(p.date)}${p.category?"・"+esc(p.category):""}</small></div><div style="display:flex;gap:8px"><button class="btn ghost" type="button" data-ed="${esc(p.id)}">編集</button><button class="btn danger" type="button" data-del="${esc(p.id)}">削除</button></div></div>`).join("")||'<p class="note">まだ論文はありません。</p>';
    $("mrows").querySelectorAll("[data-ed]").forEach(b=>b.addEventListener("click",()=>startEdit(papers.find(p=>p.id===b.dataset.ed))));
    $("mrows").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{
      if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="もう一度押して削除";setTimeout(()=>{b.dataset.armed="";b.textContent="削除"},4000);return}
      const p=papers.find(x=>x.id===b.dataset.del);b.disabled=true;say("p-msg","削除しています…");
      try{
        if(p.pdf){const f=await getFile(p.pdf);if(f)await delFile(p.pdf,f.sha,"Remove "+p.id)}
        await saveList(papers.filter(x=>x.id!==p.id),"Update archive");
        say("p-msg",`「${p.title}」を削除しました。1〜2分で反映されます。`);
      }catch(e){say("p-msg","削除できませんでした："+e.message,1);b.disabled=false}
    }));
  }
  function resetForm(){editing=null;["p-title","p-cat","p-kw","p-ab"].forEach(i=>$(i).value="");$("p-authors").value="相良壮琉";$("p-date").value=todayStr();$("p-pdf").value="";$("post-h").textContent="論文を投稿する";$("p-go").textContent="投稿する";$("p-cancel").hidden=true;$("p-pdfnote").hidden=true}
  function startEdit(p){editing=p;$("p-title").value=p.title||"";$("p-authors").value=p.authors||"";$("p-date").value=p.date||"";$("p-cat").value=p.category||"";$("p-kw").value=(p.keywords||[]).join("、");$("p-ab").value=p.abstract||"";$("p-pdf").value="";$("post-h").textContent="論文を編集する（"+p.id+"）";$("p-go").textContent="保存する";$("p-cancel").hidden=false;$("p-pdfnote").hidden=false;$("post").scrollIntoView({behavior:"smooth"})}
  $("p-cancel").addEventListener("click",resetForm);
  function nextId(date){const y=(date||todayStr()).slice(0,4);const n=papers.filter(p=>String(p.id).startsWith(y+"-")).map(p=>+String(p.id).split("-")[1]||0);return y+"-"+String((n.length?Math.max(...n):0)+1).padStart(3,"0")}
  $("p-go").addEventListener("click",async()=>{
    const t=$("p-title").value.trim(),file=$("p-pdf").files[0];
    if(!t)return say("p-msg","タイトルを入れてください。",1);
    if(!editing&&!file)return say("p-msg","PDFファイルを選んでください。",1);
    if(file&&!/\.pdf$/i.test(file.name)&&file.type!=="application/pdf")return say("p-msg","PDFファイルを選んでください。",1);
    if(file&&file.size>40*1024*1024)return say("p-msg","PDFは40MBまでにしてください。",1);
    $("p-go").disabled=true;
    try{
      const date=$("p-date").value||todayStr(),id=editing?editing.id:nextId(date),pdf=editing&&editing.pdf?editing.pdf:"papers/"+id+".pdf";
      if(file){
        say("p-msg","PDFを保存しています…");
        const b=u8b64(new Uint8Array(await file.arrayBuffer()));
        const old=await getFile(pdf);await putFile(pdf,b,old&&old.sha,(editing?"Update ":"Add ")+id);
      }
      say("p-msg","一覧を更新しています…");
      const entry={id,title:t,authors:$("p-authors").value.trim()||"相良壮琉",date,category:$("p-cat").value.trim(),abstract:$("p-ab").value.trim(),keywords:$("p-kw").value.split(/[、,，]/).map(x=>x.trim()).filter(Boolean),pdf};
      await saveList(editing?papers.map(p=>p.id===id?entry:p):[...papers,entry],"Update archive");
      say("p-msg",`${editing?"保存":"投稿"}しました（${id}）。1〜2分でサイトに反映されます。`);resetForm();
    }catch(e){say("p-msg","保存できませんでした："+e.message,1)}
    $("p-go").disabled=false;
  });
  async function connect(repo,token,quiet){
    GH={repo:repo.replace(/^https?:\/\/github\.com\//,"").replace(/\/+$/,""),token};
    try{
      const r=await gh("");if(!r.permissions||!r.permissions.push)throw new Error("このトークンでは書き込めません");
      const f=await getFile("index.html");if(!f)throw new Error("リポジトリに index.html がありません");
      LS.set("ra-repo",GH.repo);if($("gh-remember").checked)LS.set("ra-token",token);
      $("conn").hidden=true;$("post").hidden=false;$("mlist").hidden=false;$("gh-out").hidden=false;resetForm();renderManage();
    }catch(e){GH=null;if(!quiet)say("gh-msg","接続できませんでした："+e.message,1)}
  }
  $("gh-repo").value=LS.get("ra-repo")||"";
  $("gh-go").addEventListener("click",()=>{const r=$("gh-repo").value.trim(),t=$("gh-token").value.trim();if(!r||!t)return say("gh-msg","リポジトリとトークンを入れてください。",1);say("gh-msg","接続しています…");connect(r,t)});
  if(LS.get("ra-token")&&LS.get("ra-repo")){$("gh-remember").checked=true;connect(LS.get("ra-repo"),LS.get("ra-token"),true)}
  $("gh-out").addEventListener("click",()=>{GH=null;LS.set("ra-token",null);$("gh-token").value="";$("conn").hidden=false;$("post").hidden=true;$("mlist").hidden=true;$("gh-out").hidden=true;say("gh-msg","ログアウトしました。")});

  /* ---------- search box doubles as the door ---------- */
  const te=new TextEncoder(),td=new TextDecoder(),S=crypto.subtle;
  const b64=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
  const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const norm=s=>String(s||"").trim().toUpperCase().replace(/[\s-]/g,"");
  let V=null;try{V=JSON.parse($("vault").textContent)}catch(e){}
  async function derive(code){const base=await S.importKey("raw",te.encode(norm(code)),"PBKDF2",false,["deriveKey"]);return S.deriveKey({name:"PBKDF2",salt:ub64(V.salt),iterations:300000,hash:"SHA-256"},base,{name:"AES-CTR",length:256},false,["encrypt","decrypt"])}
  const ctr=()=>{const c=crypto.getRandomValues(new Uint8Array(16));c.fill(0,8);return c};
  async function makePad(key,n){const iv=ctr();return {iv,pad:new Uint8Array(await S.encrypt({name:"AES-CTR",counter:iv,length:64},key,new Uint8Array(n)))}}
  async function tryOpen(code){
    if(!V||!V.ct||norm(code).length<6)return false;
    let key,html;
    try{key=await derive(code);html=td.decode(await S.decrypt({name:"AES-CTR",counter:ub64(V.iv),length:64},key,ub64(V.ct)))}catch(e){return false}
    if(!html.startsWith("<!DOCTYPE html>"))return false;
    let outer="";try{outer=await (await fetch(location.href.split("#")[0],{cache:"no-store"})).text()}catch(e){}
    const N=Math.max(4<<20,te.encode(html).length*2),pads=[];
    for(let i=0;i<3;i++)pads.push(await makePad(key,N));
    const refill=()=>makePad(key,N).then(p=>pads.push(p)).catch(()=>{});
    const reV=/(<script type="application\/json" id="vault">)[\s\S]*?(<\/script>)/;
    // re-wrap a freshly exported inner page into this outer page, synchronously (the inner page builds a Blob right away)
    function wrap(inner){
      if(!outer||!reV.test(outer))throw new Error("outer source unavailable");
      const bytes=te.encode(inner),p=pads.shift();if(!p||p.pad.length<bytes.length)throw new Error("not ready");
      const ct=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)ct[i]=bytes[i]^p.pad[i];
      refill();
      const v=JSON.stringify({v:1,salt:V.salt,iv:b64(p.iv),ct:b64(ct)});
      return outer.replace(reV,(m,a,b)=>a+v+b);
    }
    const isInner=t=>typeof t==="string"&&t.startsWith("<!DOCTYPE html>")&&t.includes('id="'+['ledger','data'].join('-')+'"');
    const self=location.href.split("#")[0],ofetch=window.fetch.bind(window),OB=window.Blob;
    window.fetch=(u,o)=>{const s=typeof u==="string"?u:(u&&u.url)||"";try{if(new URL(s,location.href).href.split("#")[0]===self)return Promise.resolve(new Response(html,{headers:{"Content-Type":"text/html"}}))}catch(e){}return ofetch(u,o)};
    window.Blob=class extends OB{constructor(parts,opts){if(parts&&parts.length===1&&isInner(parts[0]))parts=[wrap(parts[0])];super(parts,opts)}};
    try{const ow=navigator.clipboard.writeText.bind(navigator.clipboard);navigator.clipboard.writeText=t=>ow(isInner(t)?wrap(t):t)}catch(e){}
    document.open();document.write(html);document.close();
    return true;
  }
  $("sf").addEventListener("submit",async e=>{
    e.preventDefault();render();
    const v=$("q").value;if(await tryOpen(v))return;
  });
})();
</script>
